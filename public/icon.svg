<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" filter="url(#dropShadow)" />

  <!-- Inner Soft Glow Shield -->
  <path d="M 256 70 L 400 120 C 400 270, 320 370, 256 420 C 192 370, 112 270, 112 120 Z" fill="url(#shieldGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="6" />

  <!-- Radar Pulse Rings -->
  <circle cx="256" cy="215" r="95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-dasharray="10 8" />
  <circle cx="256" cy="215" r="60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="5" />

  <!-- Modern White Location Pin -->
  <path d="M 256 120 C 205 120, 165 160, 165 212 C 165 270, 240 345, 256 360 C 272 345, 347 270, 347 212 C 347 160, 307 120, 256 120 Z" fill="#ffffff" filter="url(#dropShadow)" />

  <!-- Pin Center Family Icon / Core Ring -->
  <circle cx="256" cy="210" r="38" fill="#2563eb" />
  <circle cx="256" cy="210" r="22" fill="#ffffff" />
  <circle cx="256" cy="210" r="10" fill="#2563eb" />
</svg>
