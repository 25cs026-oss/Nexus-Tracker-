<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Royal Cobalt to Midnight Indigo Gradient -->
    <linearGradient id="bgGradient" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Pin Subtle Ambient Shadow -->
    <filter id="pinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGradient)" />

  <!-- Subtle Concentric Radar Rings -->
  <circle cx="256" cy="225" r="150" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-dasharray="10 8" />
  <circle cx="256" cy="225" r="110" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="3.5" />
  
  <!-- Subtle GPS Grid Crosshairs -->
  <line x1="256" y1="90" x2="256" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <line x1="120" y1="225" x2="392" y2="225" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Safety Shield Outline -->
  <path d="M 256 86 L 380 128 C 380 258, 312 344, 256 388 C 200 344, 132 258, 132 128 Z" fill="url(#shieldGlow)" stroke="rgba(255,255,255,0.25)" stroke-width="4.5" />

  <!-- Top Broadcast Waves -->
  <path d="M 186 142 C 206 122, 230 112, 256 112 C 282 112, 306 122, 326 142" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="7" stroke-linecap="round" />
  <path d="M 206 162 C 220 148, 237 140, 256 140 C 275 140, 292 148, 306 162" fill="none" stroke="rgba(255,255,255,0.70)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Modern White Location Pin -->
  <path d="M 256 376 C 242 350, 172 268, 172 216 C 172 166, 210 128, 256 128 C 302 128, 340 166, 340 216 C 340 268, 270 350, 256 376 Z" fill="#ffffff" filter="url(#pinShadow)" />

  <!-- Pin Core: Deep Royal Blue Ring -->
  <circle cx="256" cy="216" r="48" fill="#1D4ED8" />

  <!-- Pin Core: Pure White Middle Ring -->
  <circle cx="256" cy="216" r="30" fill="#FFFFFF" />

  <!-- Pin Core: Emerald Green Live GPS Beacon -->
  <circle cx="256" cy="216" r="16" fill="#10B981" />

  <!-- Ground Target Ripple below Pin Tip -->
  <path d="M 212 392 C 238 406, 274 406, 300 392" fill="none" stroke="rgba(255,255,255,0.50)" stroke-width="6" stroke-linecap="round" />
</svg>
